<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard IoT - ESP32 + Mosquitto</title>
  <!-- Biblioteca Paho MQTT via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { color: #333; }
    .status {
      font-weight: bold;
      margin-bottom: 20px;
      padding: 8px 16px;
      border-radius: 4px;
    }
    .connected { background-color: #d4edda; color: #155724; }
    .disconnected { background-color: #f8d7da; color: #721c24; }
    
    .cards-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      padding: 20px;
      width: 200px;
      text-align: center;
    }
    .card h3 { margin-top: 0; color: #666; }
    .card .value {
      font-size: 2.2em;
      font-weight: bold;
      color: #007bff;
    }
    .card .unit { font-size: 0.5em; color: #888; }
  </style>
</head>
<body>

  <h1>📊 Monitoramento IoT em Tempo Real</h1>
  <div id="status" class="status disconnected">Status: Desconectado</div>

  <div class="cards-container">
    <div class="card">
      <h3>Temperatura</h3>
      <div class="value"><span id="temp">--</span> <span class="unit">°C</span></div>
    </div>

    <div class="card">
      <h3>Umidade</h3>
      <div class="value"><span id="hum">--</span> <span class="unit">%</span></div>
    </div>

    <div class="card">
      <h3>Qualidade do Ar</h3>
      <div class="value"><span id="air">--</span></div>
    </div>
  </div>

  <script>
    // --- CONFIGURAÇÕES DE CONEXÃO ---
    // Substitua pelo IP do notebook onde o Mosquitto está rodando
    const MQTT_HOST = "10.136.42.68"; 
    const MQTT_PORT = 9001; // Porta WebSocket configurada no mosquitto.conf

    // Tópicos exatos publicados pelo ESP32
    const TOPIC_TEMP = "luiz/temperatura";
    const TOPIC_HUM  = "Luiz/umidade";
    const TOPIC_AIR  = "Luiz/qualidade_ar";

    // Criação do ID de Cliente único para o navegador
    const clientID = "WebDash_" + Math.random().toString(16).substr(2, 8);

    // Inicializa o cliente MQTT Paho
    const client = new Paho.MQTT.Client(MQTT_HOST, Number(MQTT_PORT), clientID);

    // Callbacks do cliente
    client.onConnectionLost = onConnectionLost;
    client.onMessageArrived = onMessageArrived;

    // Conecta ao broker
    client.connect({
      onSuccess: onConnect,
      onFailure: onFailure
    });

    function onConnect() {
      const statusDiv = document.getElementById("status");
      statusDiv.innerText = "Status: Conectado ao Mosquitto";
      statusDiv.className = "status connected";

      // Assina os tópicos após conectar com sucesso
      client.subscribe(TOPIC_TEMP);
      client.subscribe(TOPIC_HUM);
      client.subscribe(TOPIC_AIR);
    }

    function onFailure(responseObject) {
      const statusDiv = document.getElementById("status");
      statusDiv.innerText = "Status: Falha na conexão (" + responseObject.errorMessage + ")";
      statusDiv.className = "status disconnected";
    }

    function onConnectionLost(responseObject) {
      if (responseObject.errorCode !== 0) {
        const statusDiv = document.getElementById("status");
        statusDiv.innerText = "Status: Conexão Perdida";
        statusDiv.className = "status disconnected";
      }
    }

    // Processa as mensagens recebidas nos tópicos assinados
    function onMessageArrived(message) {
      const topic = message.destinationName;
      const payload = message.payloadString;

      if (topic === TOPIC_TEMP) {
        document.getElementById("temp").innerText = payload;
      } else if (topic === TOPIC_HUM) {
        document.getElementById("hum").innerText = payload;
      } else if (topic === TOPIC_AIR) {
        document.getElementById("air").innerText = payload;
      }
    }
  </script>
</body>
</html>
